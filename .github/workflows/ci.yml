name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm run setup
      - name: Syntax-check server
        run: for f in $(find server/src -name '*.js'); do node --check "$f"; done
      - name: Build web app
        run: npm run build
      - name: Seed database (smoke test)
        run: npm run seed
